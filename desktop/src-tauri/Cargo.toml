[package]
name = "studysh-desktop"
version = "0.1.2"
description = "Studysh desktop vocabulary studio"
authors = ["Studysh"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "studysh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
