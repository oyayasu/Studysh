name: Studysh Desktop Windows
on:
  push:
    branches: [main, desktop/windows-v1]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studysh-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Tauri tooling
        run: npm install --no-audit --no-fund
      - name: Validate desktop modules and behavior
        run: |
          node --check web/icons.js
          node --check web/app.js
          node --check web/prompt.js
          node --check web/core.js
          node --check web/fsrs.js
          npm test
      - name: Verify Qwen3 Python worker and resumable downloads
        run: |
          python -m py_compile src-tauri/python/qwen_tts_bridge.py
          python tests/test_qwen_download.py
      - name: Build Windows NSIS installer
        run: npm run build
      - name: Exercise the installed app, cancellation, resume and EN / JA playback
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")[0]
          $dest = Join-Path $env:RUNNER_TEMP "StudyshTest"
          $install = Start-Process $setup.FullName -ArgumentList "/S", "/D=$dest" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed" }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--remote-debugging-port=9222 --autoplay-policy=no-user-gesture-required"
          $app = Get-ChildItem $dest -Filter "*.exe" | Where-Object { $_.Name -notmatch "uninstall" } | Select-Object -First 1
          $process = Start-Process $app.FullName -PassThru
          try {
            node tests/windows-qwen.mjs
            if ($LASTEXITCODE -ne 0) { throw "Installed app smoke test failed" }
          } finally {
            Stop-Process -Id $process.Id -ErrorAction SilentlyContinue
            $log = Join-Path $env:LOCALAPPDATA "com.oyayasu.studysh.desktop/qwen3-tts/install.log"
            if (Test-Path $log) { Get-Content $log -Tail 80 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Qwen-English-Japanese-playback
          path: desktop/speech-results/*.wav
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Studysh-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish latest desktop development installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer missing" }
          $body = "Latest successful Windows installer. Commit: $env:GITHUB_SHA"
          gh release view desktop-dev --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload desktop-dev $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $assets = gh release view desktop-dev --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
            foreach ($asset in $assets) {
              if ($asset -like 'Studysh_*_x64-setup.exe' -and $asset -ne $installer.Name) {
                gh release delete-asset desktop-dev $asset --repo $env:GITHUB_REPOSITORY --yes
                if ($LASTEXITCODE -ne 0) { exit 1 }
              }
            }
            gh release edit desktop-dev --repo $env:GITHUB_REPOSITORY --title "Studysh Desktop Windows - Development" --notes $body --prerelease
          } else {
            gh release create desktop-dev $installer.FullName --repo $env:GITHUB_REPOSITORY --title "Studysh Desktop Windows - Development" --notes $body --prerelease --target $env:GITHUB_SHA
          }
