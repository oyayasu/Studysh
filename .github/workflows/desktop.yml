name: Studysh Desktop Windows
on:
  push:
    branches: [main, desktop/windows-v1]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: studysh-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Install Tauri tooling
        run: npm install --no-audit --no-fund
      - name: Validate desktop modules and behavior
        run: |
          node --check web/icons.js
          node --check web/app.js
          node --check web/prompt.js
          node --check web/core.js
          node --check web/fsrs.js
          npm test
      - name: Verify Qwen3 Python worker syntax
        run: python -m py_compile src-tauri/python/qwen_tts_bridge.py
      - name: Build Windows NSIS installer
        run: npm run build
      - name: Verify automatic managed Python 3.12 on Windows
        shell: pwsh
        run: |
          $env:UV_PYTHON_INSTALL_DIR = Join-Path $env:RUNNER_TEMP "studysh-managed-python"
          $env:UV_CACHE_DIR = Join-Path $env:RUNNER_TEMP "studysh-uv-cache"
          $environment = Join-Path $env:RUNNER_TEMP "studysh-qwen-smoke-venv"
          & ".\src-tauri\resources\uv.exe" venv --python 3.12 --managed-python $environment
          if ($LASTEXITCODE -ne 0) { throw "Failed to bootstrap private Python 3.12." }
          & (Join-Path $environment "Scripts\python.exe") -c 'import sys; assert sys.version_info[:2] == (3, 12); print(sys.version)'
          if ($LASTEXITCODE -ne 0) { throw "Private Python does not match 3.12." }
      - uses: actions/upload-artifact@v4
        with:
          name: Studysh-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish latest desktop development installer
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Installer missing" }
          $body = "Latest successful Windows installer. Commit: $env:GITHUB_SHA"
          gh release view desktop-dev --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload desktop-dev $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            $assets = gh release view desktop-dev --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name'
            foreach ($asset in $assets) {
              if ($asset -like 'Studysh_*_x64-setup.exe' -and $asset -ne $installer.Name) {
                gh release delete-asset desktop-dev $asset --repo $env:GITHUB_REPOSITORY --yes
                if ($LASTEXITCODE -ne 0) { exit 1 }
              }
            }
            gh release edit desktop-dev --repo $env:GITHUB_REPOSITORY --title "Studysh Desktop Windows - Development" --notes $body --prerelease
          } else {
            gh release create desktop-dev $installer.FullName --repo $env:GITHUB_REPOSITORY --title "Studysh Desktop Windows - Development" --notes $body --prerelease --target $env:GITHUB_SHA
          }
