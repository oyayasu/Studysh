name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Studysh-Android-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish development release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-dev --yes || true
          git push origin :refs/tags/android-dev || true
          gh release create android-dev app/build/outputs/apk/debug/*.apk --title "Studysh Android - Development" --notes "Development APK. Unsigned for store distribution; debug-signed for direct installation." --prerelease --target "${GITHUB_SHA}"
