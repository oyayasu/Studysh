name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/studysh-tests.log"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/studysh-build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: Studysh-Android-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish development release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete android-dev --yes --cleanup-tag || true
          gh release create android-dev app/build/outputs/apk/debug/*.apk --title "Studysh Android - Development" --notes "Debug-signed APK for direct installation and testing." --prerelease --target "${GITHUB_SHA}"
      - name: Record failure for independent diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Studysh Android CI diagnostics"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            for logfile in "$RUNNER_TEMP/studysh-tests.log" "$RUNNER_TEMP/studysh-build.log"; do
              if [ -f "$logfile" ]; then
                echo "## $(basename "$logfile")"
                echo '~~~text'
                tail -n 220 "$logfile"
                echo '~~~'
              fi
            done
          } > "$RUNNER_TEMP/studysh-ci-failure.md"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"[CI] Android build failure" in:title' --json number --jq '.[0].number' || true)
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/studysh-ci-failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "[CI] Android build failure" --body-file "$RUNNER_TEMP/studysh-ci-failure.md"
          fi
