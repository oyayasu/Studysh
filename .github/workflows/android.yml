name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: studysh-android-main
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/studysh-tests.log"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/studysh-build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: Studysh-Android-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish development release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          if gh release view android-dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-dev "$apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit android-dev --repo "$GITHUB_REPOSITORY" --title "Studysh Android - Development" --notes "Latest successful debug APK. Commit: ${GITHUB_SHA}" --prerelease
          else
            gh release create android-dev "$apk" --repo "$GITHUB_REPOSITORY" --title "Studysh Android - Development" --notes "Latest successful debug APK. Commit: ${GITHUB_SHA}" --prerelease --target "${GITHUB_SHA}"
          fi
      - name: Record successful release
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"[CI] Android build failure" in:title' --json number --jq '.[0].number' || true)
          if [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Android APK successfully compiled and released for commit ${GITHUB_SHA}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/android-dev"
          fi
      - name: Record failure for independent diagnostics
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "# Studysh Android CI diagnostics"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            for logfile in "$RUNNER_TEMP/studysh-tests.log" "$RUNNER_TEMP/studysh-build.log"; do
              if [ -f "$logfile" ]; then
                echo "## $(basename "$logfile")"
                echo '~~~text'
                echo '### Compiler errors and test failures'
                grep -E '^e: |^> Task .*FAILED| FAILED$| tests completed|^FAILURE:|^\* What went wrong:' "$logfile" | tail -n 100 || true
                echo '### End of build log'
                tail -n 100 "$logfile"
                echo '~~~'
              fi
            done
          } > "$RUNNER_TEMP/studysh-ci-failure.md"
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search '"[CI] Android build failure" in:title' --json number --jq '.[0].number' || true)
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/studysh-ci-failure.md"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "[CI] Android build failure" --body-file "$RUNNER_TEMP/studysh-ci-failure.md"
          fi
