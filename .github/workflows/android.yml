name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: studysh-android-main
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Checkout Piper native Android engine
        uses: actions/checkout@v5
        with:
          repository: piper-tts-apps/piper-kotlin
          ref: 287b89079336d0d02f02d2bc96e93b7ca1e72bc5
          path: piper-kotlin
          submodules: recursive
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses < /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Prepare Piper native dependencies and language data
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-piper.sh 2>&1 | tee "$RUNNER_TEMP/studysh-piper-prep.log"
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/studysh-tests.log"
      - name: Download and verify Supertonic models for real inference tests
        run: python3 scripts/download-supertonic-models.py "$RUNNER_TEMP/supertonic-models"
      - name: Test real Japanese inference with F1-F5
        env:
          SUPERTONIC_MODEL_DIR: ${{ runner.temp }}/supertonic-models
        run: gradle :speech-smoke:test --stacktrace --no-daemon --console=plain
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --no-daemon --console=plain 2>&1 | tee "$RUNNER_TEMP/studysh-build.log"
      - uses: actions/upload-artifact@v4
        with:
          name: Studysh-Android-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Publish development release
        continue-on-error: true
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          apk=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          if gh release view android-dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload android-dev "$apk" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit android-dev --repo "$GITHUB_REPOSITORY" --title "Studysh Android - Development" --notes "Latest successful debug APK. Commit: ${GITHUB_SHA}" --prerelease
          else
            gh release create android-dev "$apk" --repo "$GITHUB_REPOSITORY" --title "Studysh Android - Development" --notes "Latest successful debug APK. Commit: ${GITHUB_SHA}" --prerelease --target "${GITHUB_SHA}"
          fi
      - name: Upload test reports, voice samples and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Studysh-test-reports-and-voice-samples
          path: |
            app/build/reports/tests/
            app/build/test-results/
            speech-smoke/build/reports/tests/
            speech-smoke/build/test-results/
            speech-smoke/build/voice-samples/
            ${{ runner.temp }}/studysh-*.log
